name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản Release (VD: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write # Cấp quyền tạo Release

jobs:
  build:
    name: Build & Release
    runs-on: macos-latest # Bắt buộc phải dùng MacOS để build iOS

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build iOS (Unsigned)
        run: |
          flutter build ios --config-only
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.5'/g" ios/Podfile || true
          sed -i '' "s/^platform :ios.*/platform :ios, '15.5'/g" ios/Podfile || true
          flutter build ios --release --no-codesign
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qq -r -9 app_baucu.ipa Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}-b${{ github.run_number }}
          name: Release ${{ github.event.inputs.version }} (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            app_baucu.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
